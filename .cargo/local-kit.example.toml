# Copy to .cargo/local-kit.toml; cargo dev / cargo dev-run use sibling nova-kit.
[patch."https://github.com/misobarisic/nova-kit"]
nova-storage = { path = "../nova-kit/crates/storage" }
nova-ui-base = { path = "../nova-kit/crates/ui-base" }
nova-cache = { path = "../nova-kit/crates/cache" }
nova-image = { path = "../nova-kit/crates/image" }
nova-sync = { path = "../nova-kit/crates/sync" }
nova-net = { path = "../nova-kit/crates/net" }
