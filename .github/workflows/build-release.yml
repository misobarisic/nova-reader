name: Nova Reader CI
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
env:
  NOVA_READER_RELEASE_PROFILE: cd-release
  CARGO_INCREMENTAL: '0'
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          github_access_token: ${{ github.token }}
      - name: Validate exact checkout and tag version
        run: python3 .github/scripts/validate-release.py
      - run: nix develop .#default --command make check
      - run: nix develop .#default --command cargo check --locked --no-default-features --features desktop
  check-windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          github_access_token: ${{ github.token }}
      - run: nix develop .#windows --command cargo check --workspace --locked --target x86_64-pc-windows-gnu
  check-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          github_access_token: ${{ github.token }}
      - run: nix develop .#android --command cargo check --locked --target aarch64-linux-android --no-default-features --features android,update-check --lib
      - run: nix develop .#android --command make check-android-java
  package-android:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [validate, check-windows, check-android]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          github_access_token: ${{ github.token }}
      - name: Configure distribution signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/reader-release.keystore"
          echo "CARGO_APK_CD_RELEASE_KEYSTORE=$RUNNER_TEMP/reader-release.keystore" >> "$GITHUB_ENV"
          echo "CARGO_APK_CD_RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
      - run: nix develop .#android --command bash .github/scripts/dependency-licenses.sh android
      - run: nix develop .#android --command make android-build-release-universal RELEASE_PROFILE=cd-release UPDATE_FEATURES=,update-check
      - run: nix develop .#android --command python3 .github/scripts/package-android.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reader-android
          path: dist/*.apk
          if-no-files-found: error
  package-windows:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [validate, check-windows, check-android]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          github_access_token: ${{ github.token }}
      - run: nix develop .#windows --command bash .github/scripts/dependency-licenses.sh windows
      - run: nix develop .#windows --command cargo build --locked --profile cd-release --target x86_64-pc-windows-gnu --features update-check --bin nova-reader
      - run: nix develop .#windows --command bash .github/scripts/package-windows.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reader-windows
          path: dist/*.zip
          if-no-files-found: error
  package-linux:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [validate, check-windows, check-android]
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
      - name: Install Ubuntu 22.04 build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential curl desktop-file-utils dpkg-dev imagemagick libegl-dev libfontconfig1-dev libfreetype6-dev libfuse2 libvulkan-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxkbcommon-dev libxrandr-dev patchelf pkg-config squashfs-tools
      - run: cargo install cargo-about --locked --version 0.9.1 --features cli
      - run: bash .github/scripts/dependency-licenses.sh linux
      - run: cargo build --locked --profile cd-release --features update-check --bin nova-reader
      - run: bash .github/scripts/package-linux.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reader-linux
          path: dist/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package-android, package-windows, package-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: reader-*
          path: dist
          merge-multiple: true
      - name: Verify complete artifact set
        run: |
          test "$(find dist -name '*.apk' | wc -l)" -eq 4
          test "$(find dist -name '*.deb' | wc -l)" -eq 1
          test "$(find dist -name '*.AppImage' | wc -l)" -eq 1
          test "$(find dist -name '*.zip' | wc -l)" -eq 1
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: dist/*
          fail_on_unmatched_files: true
