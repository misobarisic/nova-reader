name: Nova Reader CI

on:
  pull_request:
    paths:
      - ".github/workflows/build-release.yml"
      - ".rustfmt.toml"
      - "rustfmt.toml"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - ".github/scripts/package-android.py"
      - ".github/scripts/test_package_android.py"
      - ".github/scripts/test_package_windows.py"
      - ".github/scripts/package-linux.sh"
      - ".github/scripts/package-windows.sh"
      - ".github/scripts/nova-reader.desktop"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "about.toml"
      - "build.rs"
      - "build-support/**"
      - "crates/**"
      - "src/**"
      - "android/**"
      - "vendor/**"
      - "assets/**"
      - "nix/**"
      - "flake.nix"
      - "flake.lock"
      - "Makefile"
      - "tests/**"
      - "tools/**"
      - "examples/**"
      - ".github/scripts/**"
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/build-release.yml"
      - ".rustfmt.toml"
      - "rustfmt.toml"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - ".github/scripts/package-android.py"
      - ".github/scripts/test_package_android.py"
      - ".github/scripts/test_package_windows.py"
      - ".github/scripts/package-linux.sh"
      - ".github/scripts/package-windows.sh"
      - ".github/scripts/nova-reader.desktop"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "about.toml"
      - "build.rs"
      - "build-support/**"
      - "crates/**"
      - "src/**"
      - "android/**"
      - "vendor/**"
      - "assets/**"
      - "nix/**"
      - "flake.nix"
      - "flake.lock"
      - "Makefile"
      - "tests/**"
      - "tools/**"
      - "examples/**"
      - ".github/scripts/**"
    tags:
      - "**"

permissions:
  contents: read

env:
  NOVA_RELEASE_PROFILE: cd-release
  CARGO_INCREMENTAL: "0"

# Cancel stale pull-request and main-branch runs when newer commits arrive.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}

jobs:
  check-linux:
    name: Linux formatting, Clippy, and workspace check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: nova-reader-ci-v1
          key: nix-${{ hashFiles('flake.lock') }}
          cmd-format: nix develop .#default --command {0}
          cache-targets: true
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Validate exact checkout and tag version
        run: python3 .github/scripts/validate-release.py

      - name: Check Rust formatting
        run: nix develop .#default --command cargo fmt --all -- --check

      - name: Test release packaging
        run: |
          python3 -B -m unittest discover -s .github/scripts -p 'test_package_*.py'

      - name: Run Clippy
        run: nix develop .#default --command cargo clippy --workspace --locked -- -D warnings

      - name: Check Rust workspace
        run: nix develop .#default --command cargo check --workspace --locked

      - name: Check distro build without update checks
        run: nix develop .#default --command cargo check --locked -p nova-reader --no-default-features --features desktop

      - name: Test reader services and headless navigation
        run: nix develop .#default --command cargo test --workspace --locked

      - name: Test source parsers and deterministic addon packages
        run: nix develop .#default --command make check-addons

  check-windows:
    name: Windows GNU target check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: nova-reader-ci-v1
          key: nix-${{ hashFiles('flake.lock') }}
          cmd-format: nix develop .#windows --command {0}
          cache-targets: true
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check Windows GNU target
        run: >-
          nix develop .#windows --command cargo check --workspace --locked
          --target x86_64-pc-windows-gnu

  check-android:
    name: Android ARM64 target check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Free unused Android SDK space
        # The job uses the Nix SDK/NDK, not the runner's preinstalled SDK.
        run: sudo rm -rf /usr/local/lib/android

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: nova-reader-ci-v1
          key: nix-${{ hashFiles('flake.lock') }}
          # Keep shellHook diagnostics out of rust-cache's cargo metadata JSON.
          cmd-format: >-
            sh -c "nix develop .#android --command sh -c '{0} >&3' 3>&1 1>&2"
          cache-targets: true
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check Android document activity
        run: nix develop .#android --command make check-android-java

      - name: Check Android ARM64 target
        run: >-
          nix develop .#android --command cargo check --locked
          --target aarch64-linux-android --no-default-features --features android,update-check
          --lib -p nova-reader

  android-build:
    needs: [check-linux, check-windows, check-android]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    name: Build Android ${{ matrix.abi }} APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
          - abi: x86_64
            target: x86_64-linux-android
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}

      # Use the same Cargo-profile signing fallback as Nova. When a reader
      # private-key override is configured, keep that identity on every ABI
      # and on the assembled outputs.
      - name: Configure optional Android signing override
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" || -n "$KEYSTORE_PASSWORD" ]]; then
            test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD"
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/reader-release.keystore"
            echo "CARGO_APK_CD_RELEASE_KEYSTORE=$RUNNER_TEMP/reader-release.keystore" >> "$GITHUB_ENV"
            echo "CARGO_APK_CD_RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Generate Android dependency license inventory
        run: nix develop .#android --command bash .github/scripts/dependency-licenses.sh android

      - name: Build release APK for this ABI
        env:
          ANDROID_TARGET: ${{ matrix.target }}
        run: >-
          nix develop .#android --command make android-build-release
          ANDROID_TARGET="$ANDROID_TARGET" RELEASE_PROFILE="$NOVA_RELEASE_PROFILE"

      - name: Upload ABI build input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nova-reader-android-input-${{ matrix.abi }}
          path: target/${{ env.NOVA_RELEASE_PROFILE }}/apk/nova_reader.apk
          if-no-files-found: error
          retention-days: 1

  android-package:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    name: Assemble Android APKs (three ABIs and compressed universal)
    needs: [android-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}

      - name: Download all ABI inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nova-reader-android-input-*
          path: android-inputs
          merge-multiple: false

      # Use the same Cargo-profile signing fallback as Nova. When a reader
      # private-key override is configured, keep that identity on every ABI
      # and on the assembled outputs.
      - name: Configure optional Android signing override
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" || -n "$KEYSTORE_PASSWORD" ]]; then
            test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD"
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/reader-release.keystore"
            echo "CARGO_APK_CD_RELEASE_KEYSTORE=$RUNNER_TEMP/reader-release.keystore" >> "$GITHUB_ENV"
            echo "CARGO_APK_CD_RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Merge, align, sign, and verify all APKs
        run: >-
          nix develop .#android --command python3 .github/scripts/package-android.py
          --abi-apk arm64-v8a=android-inputs/nova-reader-android-input-arm64-v8a/nova_reader.apk
          --abi-apk armeabi-v7a=android-inputs/nova-reader-android-input-armeabi-v7a/nova_reader.apk
          --abi-apk x86_64=android-inputs/nova-reader-android-input-x86_64/nova_reader.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nova-reader-android-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 1

  linux-build:
    needs: [check-linux, check-windows, check-android]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    name: Build Linux x86_64 packages (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable

      - name: Install Linux build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential clang cmake curl desktop-file-utils dpkg-dev imagemagick \
            libclang-dev libegl-dev libfontconfig1-dev libfreetype6-dev libfuse2 \
            libvulkan-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libxrandr-dev patchelf pkg-config squashfs-tools

      - name: Install cargo-about
        run: cargo install cargo-about --locked --version 0.9.1 --features cli

      - name: Generate Linux dependency license inventory
        run: bash .github/scripts/dependency-licenses.sh linux

      - name: Build Nova Reader release binary
        run: cargo build --locked --profile "$NOVA_RELEASE_PROFILE" --bin nova-reader

      - name: Package Debian and AppImage artifacts
        run: bash .github/scripts/package-linux.sh

      - name: Upload Linux artifacts
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nova-reader-linux-x86_64
          path: |
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 1

  windows-build:
    needs: [check-linux, check-windows, check-android]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    name: Build Windows x86_64 (MinGW)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      artifact-id: ${{ steps.upload-windows.outputs.artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}

      - name: Generate Windows dependency license inventory
        run: nix develop .#windows --command bash .github/scripts/dependency-licenses.sh windows

      - name: Build Windows executable
        run: >-
          nix develop .#windows --command cargo build --locked --profile "$NOVA_RELEASE_PROFILE"
          --target x86_64-pc-windows-gnu --bin nova-reader

      - name: Stage Windows release bundle
        run: nix develop .#windows --command bash .github/scripts/package-windows.sh

      - name: Upload Windows artifact
        id: upload-windows
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/*.zip
          # The bundle is already zipped; upload it without a second ZIP layer.
          archive: false
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish tag release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [android-package, linux-build, windows-build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nova-reader-android-apks
          path: dist

      - name: Download Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nova-reader-linux-x86_64
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.windows-build.outputs.artifact-id }}
          path: dist
          # Preserve the release ZIP instead of extracting its executable/DLLs.
          skip-decompress: true

      - name: Verify complete release artifact set
        run: |
          test "$(find dist -name '*.apk' | wc -l)" -eq 4
          test "$(find dist -name '*.deb' | wc -l)" -eq 1
          test "$(find dist -name '*.AppImage' | wc -l)" -eq 1
          test "$(find dist -name '*.zip' | wc -l)" -eq 1

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: Nova Reader ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
