[package]
name = "reader-sources"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
rquickjs = { version = "0.14", default-features = false, features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "cookies"] }
scraper = "0.24"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
nova-net = { workspace = true }
nova-storage = { workspace = true, features = ["zip"] }
sha2 = "0.10"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[target.'cfg(target_os = "android")'.dependencies]
rquickjs = { version = "0.14", default-features = false, features = ["std", "bindgen"] }
nova-net = { workspace = true, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"
