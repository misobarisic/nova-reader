[package]
name = "nova-reader-ui-shared"
version = "0.1.0"
edition = "2024"
license.workspace = true
# Exposes the compiled NovaUiShared library to the window and page crates.
links = "novauishared"

[lib]
# UI coverage lives in the root integration suites.
test = false

[dependencies]
slint = { workspace = true }
nova-ui-base = { workspace = true }
i-slint-core = { version = "=1.18.0", default-features = false }

[build-dependencies]
slint-build = { workspace = true, features = ["experimental-module-builds"] }
nova-ui-base = { workspace = true }
