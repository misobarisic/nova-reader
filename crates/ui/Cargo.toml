[package]
name = "nova-reader-ui"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
slint = { workspace = true }
nova-ui-base = { workspace = true }
i-slint-core = { version = "=1.18.0", default-features = false }
nova-reader-ui-shared = { path = "../ui-shared" }
nova-reader-ui-library = { path = "../ui-library" }
nova-reader-ui-timeline = { path = "../ui-timeline" }
nova-reader-ui-browse = { path = "../ui-browse" }
nova-reader-ui-settings-storage = { path = "../ui-settings-storage" }
nova-reader-ui-settings-capture = { path = "../ui-settings-capture" }
nova-reader-ui-settings-sync = { path = "../ui-settings-sync" }
nova-reader-ui-settings-look = { path = "../ui-settings-look" }

[build-dependencies]
slint-build = { workspace = true, features = ["experimental-module-builds"] }
nova-ui-base = { workspace = true }
